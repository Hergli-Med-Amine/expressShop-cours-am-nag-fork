name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: tp03
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - run: npm ci
    - run: npm test
